<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d0f14">
<meta name="apple-mobile-web-app-title" content="Тренировка">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Тренировка</title>
<style>
  :root{
    --bg:#0d0f14; --card:#171a22; --card2:#1f2330; --line:#2a2f3d;
    --txt:#e8eaf0; --muted:#8b90a0; --accent:#4f8cff; --accent2:#6ad29a;
    --warn:#e0a64a; --done:#6ad29a; --danger:#e0574a;
    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; background:var(--bg); color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:16px; line-height:1.4}
  body{padding:0 0 96px; max-width:560px; margin:0 auto}
  header{position:sticky; top:0; z-index:5; background:linear-gradient(180deg,var(--bg) 80%,transparent);
    padding:10px 14px 8px}
  /* selector */
  .selector{display:flex; gap:8px; overflow-x:auto; padding:2px 0 8px; -webkit-overflow-scrolling:touch}
  .chip{flex:0 0 auto; background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:7px 12px; cursor:pointer; min-width:96px}
  .chip.active{border-color:var(--accent); background:var(--card2)}
  .chip .ct{font-size:14px; font-weight:700; display:flex; align-items:center; gap:5px}
  .chip .cd{font-size:11px; color:var(--muted); margin-top:1px}
  .chip .dot{font-size:12px}
  .title{font-size:19px; font-weight:700; letter-spacing:.2px}
  .sub{color:var(--muted); font-size:13px; margin-top:2px}
  .meta{color:var(--accent); font-size:13px; font-weight:600; margin-top:3px}
  .clockbar{display:flex; align-items:center; gap:12px; margin-top:10px}
  .startbtn{background:var(--accent2); color:#0d0f14; border:none; border-radius:10px;
    padding:8px 18px; font-size:15px; font-weight:700; cursor:pointer; font-family:inherit}
  .startbtn.run{background:var(--card2); color:var(--txt); border:1px solid var(--line)}
  .elapsed{font-variant-numeric:tabular-nums; font-weight:700; font-size:16px; color:var(--txt)}
  .elapsed.idle{color:var(--muted); font-weight:400; font-size:14px}
  .progress{height:4px; background:var(--card); border-radius:4px; margin-top:10px; overflow:hidden}
  .progress>i{display:block; height:100%; width:0; background:var(--accent2); transition:width .3s}
  main{padding:4px 12px}
  .group-name{font-size:12px; font-weight:700; color:var(--accent); letter-spacing:1px;
    margin:18px 6px 2px; text-transform:uppercase}
  .group-hint{font-size:12px; color:var(--muted); margin:0 6px 6px}
  .row{background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:12px 14px; margin:6px 0; display:flex; align-items:center; gap:12px; cursor:pointer;
    transition:background .15s, border-color .15s}
  .row:active{background:var(--card2)}
  .row.done{border-color:var(--done)}
  .row .body{flex:1; min-width:0}
  .row1{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap}
  .code{font-weight:800; color:var(--muted); font-size:13px}
  .name{font-weight:700; font-size:15px}
  .setno{font-size:12px; color:var(--muted); font-weight:600}
  .badge{font-size:10px; background:var(--card2); color:var(--warn); padding:1px 6px;
    border-radius:20px; border:1px solid var(--line)}
  .rec{color:var(--muted); font-size:13px; margin-top:3px}
  .rec b{color:var(--txt); font-weight:600}
  .cue{color:var(--muted); font-size:12px; margin-top:4px; font-style:italic; opacity:.85}
  .entered{color:var(--accent2); font-size:14px; font-weight:600; margin-top:4px; font-variant-numeric:tabular-nums}
  .check{width:24px; height:24px; border-radius:50%; border:2px solid var(--line);
    flex:none; display:flex; align-items:center; justify-content:center; font-size:14px; color:transparent}
  .row.done .check{background:var(--done); border-color:var(--done); color:#0d0f14}
  .fcard{background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px; margin:14px 0 6px}
  .fcard h3{margin:0 0 10px; font-size:13px; color:var(--accent); letter-spacing:1px; text-transform:uppercase}
  .field{margin:10px 0}
  .field label{display:block; font-size:13px; color:var(--muted); margin-bottom:4px}
  .field input{width:100%; background:var(--bg); border:1px solid var(--line);
    color:var(--txt); border-radius:10px; padding:10px 12px; font-size:16px; font-family:inherit}
  .seg{display:flex; gap:6px}
  .seg button{flex:1; background:var(--bg); border:1px solid var(--line); color:var(--muted);
    padding:9px 4px; border-radius:10px; font-size:14px; cursor:pointer}
  .seg button.on{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600}
  .actions{position:fixed; left:0; right:0; bottom:0; z-index:6;
    display:flex; gap:10px; padding:12px 14px calc(12px + env(safe-area-inset-bottom));
    background:linear-gradient(0deg,var(--bg) 65%,transparent); max-width:560px; margin:0 auto}
  .btn{flex:1; border:none; border-radius:14px; padding:15px; font-size:16px; font-weight:700;
    cursor:pointer; font-family:inherit}
  .btn.primary{background:var(--accent); color:#fff}
  .btn.ghost{flex:0 0 auto; background:var(--card2); color:var(--muted); border:1px solid var(--line)}
  .overlay{position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:10; display:none;
    align-items:flex-end; justify-content:center}
  .overlay.open{display:flex}
  .sheet{background:var(--card); width:100%; max-width:560px; border-radius:20px 20px 0 0;
    padding:18px 16px calc(18px + env(safe-area-inset-bottom)); max-height:88vh; overflow:auto;
    animation:up .2s ease}
  @keyframes up{from{transform:translateY(40px); opacity:.5}to{transform:none; opacity:1}}
  .sheet h2{margin:0 0 2px; font-size:18px}
  .sheet .sub{color:var(--muted); font-size:13px; margin-bottom:14px}
  .setrow{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; align-items:center; margin:6px 0}
  .setrow.drop2{grid-template-columns:1fr 1fr}
  .setrow input{width:100%; background:var(--bg); border:1px solid var(--line); color:var(--txt);
    border-radius:10px; padding:14px 6px; font-size:18px; text-align:center; font-variant-numeric:tabular-nums}
  .setrow input:focus{border-color:var(--accent); outline:none}
  .heads{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:2px}
  .heads.h2c{grid-template-columns:1fr 1fr}
  .heads span{font-size:11px; color:var(--muted); text-align:center; text-transform:uppercase; letter-spacing:.5px}
  .sheet-actions{display:flex; gap:10px; margin-top:18px}
  .toast{position:fixed; bottom:90px; left:50%; transform:translateX(-50%); background:var(--accent2);
    color:#0d0f14; font-weight:700; padding:12px 20px; border-radius:30px; z-index:20; opacity:0;
    transition:opacity .25s, transform .25s; pointer-events:none; max-width:90%}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-6px)}
  .exportbox{width:100%; height:240px; background:var(--bg); color:var(--txt); border:1px solid var(--line);
    border-radius:12px; padding:12px; font-family:ui-monospace,Menlo,monospace; font-size:13px; margin-top:8px}
  .rest{position:fixed; left:0; right:0; bottom:74px; z-index:7; max-width:560px; margin:0 auto;
    padding:0 14px; transform:translateY(160%); transition:transform .25s}
  .rest.show{transform:none}
  .rest-inner{background:var(--card2); border:1px solid var(--line); border-radius:14px;
    padding:10px 12px; display:flex; align-items:center; gap:10px; box-shadow:0 6px 24px rgba(0,0,0,.4)}
  .rest .time{font-size:26px; font-weight:800; font-variant-numeric:tabular-nums; min-width:78px; text-align:center}
  .rest .time.done{color:var(--accent2)}
  .rest .chips{display:flex; gap:6px; flex:1; flex-wrap:wrap; justify-content:flex-end}
  .rest .chips button{background:var(--bg); border:1px solid var(--line); color:var(--muted);
    border-radius:8px; padding:7px 9px; font-size:13px; cursor:pointer; font-variant-numeric:tabular-nums}
  .rest .x{background:none; border:none; color:var(--muted); font-size:20px; cursor:pointer; padding:4px 6px}
</style>
</head>

<script>
(function(){
  "use strict";
  const $ = (s,el=document)=>el.querySelector(s);
  const totSets = ex => ex.bodyweight ? 1 : (ex.dropset ? 1 : ex.sets);
  const skey = id => "workout-" + id;

  // ---- выбор активной тренировки ----
  let W, KEY, state;
  function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {sets:{},footer:{}}; }catch(e){ return {sets:{},footer:{}}; } }
  function save(){ localStorage.setItem(KEY, JSON.stringify(state)); }
  function allEx(){ return W.groups.flatMap(g=>g.exercises); }

  function selectWorkout(id){
    W = WORKOUTS.find(w=>w.id===id) || WORKOUTS[0];
    KEY = skey(W.id); state = load();
    localStorage.setItem("workout-current", W.id);
  }
  // статус сессии по её хранилищу (для чипов)
  function statusOf(id){
    let s; try{ s=JSON.parse(localStorage.getItem(skey(id))); }catch(e){}
    if(s && s.finishedAt) return "done";
    if(s && s.sets && Object.keys(s.sets).length) return "progress";
    return "todo";
  }

  // ---- время ----
  function now(){ return Date.now(); }
  function fmtClock(ms){ const d=new Date(ms); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
  function fmtMMSS(sec){ sec=Math.max(0,Math.round(sec)); return Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0"); }
  function allTimes(){ const ts=[]; Object.keys(state.sets).forEach(k=>{ const v=state.sets[k];
    if(Array.isArray(v)) v.forEach(s=>{ if(s&&s.t) ts.push(s.t); }); else if(v&&v.t) ts.push(v.t); }); return ts; }
  function startTs(){ if(state.startedAt) return state.startedAt; const ts=allTimes(); return ts.length?Math.min.apply(null,ts):null; }
  function finishTs(){ if(state.finishedAt) return state.finishedAt; const ts=allTimes(); return ts.length?Math.max.apply(null,ts):null; }
  function exFirstT(ex){ const v=state.sets[ex.code]; if(Array.isArray(v)){ const ts=v.filter(s=>s&&s.t).map(s=>s.t); return ts.length?Math.min.apply(null,ts):null; } return (v&&v.t)?v.t:null; }

  // ---- селектор сессий ----
  function renderSelector(){
    const sel=$("#selector"); sel.innerHTML="";
    WORKOUTS.forEach(w=>{
      const st=statusOf(w.id);
      const dot = st==="done"?'<span class="dot">✓</span>':(st==="progress"?'<span class="dot">◐</span>':'');
      const c=document.createElement("div");
      c.className="chip"+(w.id===W.id?" active":"");
      c.innerHTML='<div class="ct">'+w.title.replace("Day ","D")+' '+dot+'</div><div class="cd">'+w.day+' '+w.date+'</div>';
      c.onclick=()=>{ if(w.id!==W.id){ stopRest(); selectWorkout(w.id); renderAll(); } };
      sel.appendChild(c);
    });
  }

  // ---- шапка ----
  function renderHeader(){
    $("#h-title").textContent = "#"+W.id+" · "+W.title;
    $("#h-sub").textContent = W.subtitle;
    $("#h-meta").textContent = W.day+" "+W.date+" · "+W.location;
  }

  // ---- порядок строк (round-major интерливинг суперсета) ----
  function buildRows(){
    const rows=[];
    W.groups.forEach(g=>{
      rows.push({grp:g});
      const maxS = Math.max.apply(null, g.exercises.map(totSets));
      for(let i=0;i<maxS;i++) g.exercises.forEach(ex=>{ if(i<totSets(ex)) rows.push({ex, i, total:totSets(ex)}); });
    });
    return rows;
  }
  function setEntry(code,i){ const a=state.sets[code]; return (a && typeof a==="object" && a[i]) ? a[i] : null; }
  function filled(s){ return s && [s.w,s.r,s.rpe].some(v=> v!==undefined && v!==""); }
  function rowDone(ex,i){
    if(ex.bodyweight) return !!state.sets[ex.code];
    if(ex.dropset){ const a=state.sets[ex.code]; return Array.isArray(a) && a.some(s=> s && ((s.w!==undefined&&s.w!=="")||(s.r!==undefined&&s.r!==""))); }
    return filled(setEntry(ex.code,i));
  }
  function enteredText(ex,i){
    if(ex.bodyweight) return state.sets[ex.code] ? "сделано ✓" : "";
    if(ex.dropset){ const a=state.sets[ex.code]; if(!Array.isArray(a)) return ""; const drops=ex.drops||[];
      return drops.map((dw,k)=>{ const s=a[k]||{}; const w=(s.w!==undefined&&s.w!=="")?s.w:dw; const r=(s.r!==undefined&&s.r!=="")?s.r:"_"; return w+"×"+r; }).join(" → "); }
    const s=setEntry(ex.code,i); if(!filled(s)) return "";
    return (s.w!==""&&s.w!==undefined?s.w:"_")+"×"+(s.r!==""&&s.r!==undefined?s.r:"_")+(s.rpe!==""&&s.rpe!==undefined?" · RPE "+s.rpe:"");
  }

  function render(){
    const main=$("#main"); main.innerHTML="";
    buildRows().forEach(r=>{
      if(r.grp){
        const gn=document.createElement("div"); gn.className="group-name"; gn.textContent=r.grp.name; main.appendChild(gn);
        if(r.grp.hint){ const h=document.createElement("div"); h.className="group-hint"; h.textContent=r.grp.hint; main.appendChild(h); }
      } else main.appendChild(rowEl(r.ex, r.i, r.total));
    });
    main.appendChild(footerCard());
    updateProgress();
  }
  function rowEl(ex,i,total){
    const c=document.createElement("div"); c.className="row"+(rowDone(ex,i)?" done":"");
    const body=document.createElement("div"); body.className="body";
    const r1=document.createElement("div"); r1.className="row1";
    let head='<span class="code">'+ex.code+'</span><span class="name">'+ex.name+'</span>';
    if(!ex.bodyweight && !ex.dropset && total>1) head+='<span class="setno">подход '+(i+1)+'/'+total+'</span>';
    if(ex.isNew && i===0) head+='<span class="badge">⚙️ калибровка</span>';
    r1.innerHTML=head; body.appendChild(r1);
    const rec=document.createElement("div"); rec.className="rec";
    if(ex.bodyweight) rec.innerHTML='<b>'+ex.weight+'</b>';
    else if(ex.dropset) rec.innerHTML='<b>'+ex.weight+'</b> · '+ex.reps;
    else rec.innerHTML='<b>'+ex.weight+'</b> · '+ex.reps+' повт · RPE '+ex.rpe;
    body.appendChild(rec);
    if(ex.cue && i===0){ const q=document.createElement("div"); q.className="cue"; q.textContent=ex.cue; body.appendChild(q); }
    const et=enteredText(ex,i);
    if(et){ const e=document.createElement("div"); e.className="entered"; e.textContent=et; body.appendChild(e); }
    const chk=document.createElement("div"); chk.className="check"; chk.textContent="✓";
    c.appendChild(body); c.appendChild(chk);
    c.onclick = ()=> ex.bodyweight ? toggleBody(ex) : (ex.dropset ? openDrop(ex) : openSet(ex,i));
    return c;
  }
  function toggleBody(ex){
    if(state.sets[ex.code]) delete state.sets[ex.code]; else state.sets[ex.code]={t:now()};
    save(); renderClock(); renderSelector(); render();
  }

  // ---- модалка подхода ----
  let current=null;
  function openSet(ex,i){
    current={ex,i};
    const s=setEntry(ex.code,i)||{}; const d=ex.def||{};
    const w=s.w!==undefined?s.w:(d.w!==undefined?d.w:""), r=s.r!==undefined?s.r:(d.r!==undefined?d.r:""), rpe=s.rpe!==undefined?s.rpe:(d.rpe!==undefined?d.rpe:"");
    $("#sheet").innerHTML='<h2>'+ex.code+' · '+ex.name+'</h2>'
      +'<div class="sub">'+(ex.sets>1?"Подход "+(i+1)+"/"+ex.sets+" · ":"")+'ориентир '+ex.weight+' · RPE '+ex.rpe+'</div>'
      +'<div class="heads"><span>вес</span><span>повт</span><span>RPE</span></div>'
      +'<div class="setrow"><input inputmode="decimal" id="f-w" value="'+w+'" placeholder="кг">'
      +'<input inputmode="numeric" id="f-r" value="'+r+'" placeholder="повт">'
      +'<input inputmode="decimal" id="f-rpe" value="'+rpe+'" placeholder="RPE"></div>'
      +'<div class="sheet-actions"><button class="btn ghost" id="m-cancel">Отмена</button><button class="btn primary" id="m-save">Сохранить</button></div>';
    $("#m-cancel").onclick=closeSheet; $("#m-save").onclick=saveSet; $("#overlay").classList.add("open");
  }
  function saveSet(){
    const {ex,i}=current;
    if(!Array.isArray(state.sets[ex.code])) state.sets[ex.code]=[];
    state.sets[ex.code][i]={ w:$("#f-w").value.trim(), r:$("#f-r").value.trim(), rpe:$("#f-rpe").value.trim(), t:now() };
    closeSheet(); afterLog(); render();
  }
  // ---- модалка дроп-сета ----
  function openDrop(ex){
    current={ex};
    const a=Array.isArray(state.sets[ex.code])?state.sets[ex.code]:[]; const drops=ex.drops||[8,6,4];
    let rows='<div class="heads h2c"><span>вес (кг)</span><span>повторов</span></div>';
    drops.forEach((dw,k)=>{ const s=a[k]||{}; const w=(s.w!==undefined&&s.w!=="")?s.w:dw; const r=(s.r!==undefined)?s.r:"";
      rows+='<div class="setrow drop2"><input inputmode="decimal" data-k="'+k+'" data-f="w" value="'+w+'" placeholder="кг">'
        +'<input inputmode="numeric" data-k="'+k+'" data-f="r" value="'+r+'" placeholder="повт"></div>'; });
    $("#sheet").innerHTML='<h2>'+ex.name+'</h2><div class="sub">'+ex.cue+'</div>'+rows
      +'<div class="sheet-actions"><button class="btn ghost" id="m-cancel">Отмена</button><button class="btn primary" id="m-save">Сохранить</button></div>';
    $("#m-cancel").onclick=closeSheet; $("#m-save").onclick=saveDrop; $("#overlay").classList.add("open");
  }
  function saveDrop(){
    const ex=current.ex; const drops=ex.drops||[8,6,4]; const arr=drops.map(()=>({w:"",r:""}));
    $("#sheet").querySelectorAll("input").forEach(inp=>{ arr[+inp.dataset.k][inp.dataset.f]=inp.value.trim(); });
    arr[0].t=now(); state.sets[ex.code]=arr; closeSheet(); afterLog(); render();
  }
  function closeSheet(){ $("#overlay").classList.remove("open"); current=null; }
  $("#overlay").addEventListener("click",e=>{ if(e.target.id==="overlay") closeSheet(); });

  // ---- футер ----
  function footerCard(){
    const fc=document.createElement("div"); fc.className="fcard"; fc.innerHTML='<h3>После сессии</h3>';
    W.footer.forEach(f=>{
      const wrap=document.createElement("div"); wrap.className="field";
      const lab=document.createElement("label"); lab.textContent=f.label; wrap.appendChild(lab);
      if(f.type==="seg"){
        const seg=document.createElement("div"); seg.className="seg";
        f.opts.forEach(o=>{ const b=document.createElement("button"); b.textContent=o; if(state.footer[f.key]===o) b.classList.add("on");
          b.onclick=()=>{ state.footer[f.key]=state.footer[f.key]===o?"":o; save(); render(); }; seg.appendChild(b); });
        wrap.appendChild(seg);
      } else {
        const inp=document.createElement("input"); inp.type="text"; inp.placeholder=f.placeholder||""; inp.value=state.footer[f.key]||"";
        inp.oninput=()=>{ state.footer[f.key]=inp.value; save(); }; wrap.appendChild(inp);
      }
      fc.appendChild(wrap);
    });
    return fc;
  }
  function updateProgress(){
    const rows=buildRows().filter(r=>r.ex); const total=rows.length; const done=rows.filter(r=>rowDone(r.ex,r.i)).length;
    $("#prog").style.width=(total?Math.round(done/total*100):0)+"%";
  }

  // ---- часы / старт-финиш ----
  const startBtn=$("#startbtn"), elapsedEl=$("#elapsed"), exportBtn=$("#export");
  function renderClock(){
    if(state.finishedAt){ const st=startTs()||state.finishedAt;
      startBtn.textContent="▶ Возобновить"; startBtn.className="startbtn";
      elapsedEl.className="elapsed"; elapsedEl.textContent="⏱ "+fmtMMSS((state.finishedAt-st)/1000)+" · завершена";
      exportBtn.style.display=""; return; }
    exportBtn.style.display="none";
    if(state.startedAt){ startBtn.textContent="✓ Завершить тренировку"; startBtn.className="startbtn run";
      elapsedEl.className="elapsed"; elapsedEl.textContent="⏱ "+fmtMMSS((now()-state.startedAt)/1000); return; }
    startBtn.textContent="▶ Старт"; startBtn.className="startbtn"; elapsedEl.className="elapsed idle"; elapsedEl.textContent="не начата";
  }
  startBtn.onclick=()=>{
    if(state.finishedAt){ delete state.finishedAt; save(); renderClock(); renderSelector(); return; }
    if(state.startedAt){ state.finishedAt=now(); save(); stopRest(); renderClock(); renderSelector(); toast("Тренировка завершена — жми Экспорт"); return; }
    state.startedAt=now(); delete state.finishedAt; save(); renderClock(); renderSelector();
  };
  setInterval(()=>{ if(state.startedAt && !state.finishedAt) renderClock(); }, 1000);

  // ---- таймер отдыха ----
  const restEl=$("#rest"), restTimeEl=$("#rest-time"), restChips=$("#rest-chips");
  const REST_PRESETS=[30,45,60,90,120]; let restEnd=0, restInt=null, restPlayed=false;
  REST_PRESETS.forEach(s=>{ const b=document.createElement("button"); b.textContent=fmtMMSS(s); b.onclick=()=>startRest(s); restChips.appendChild(b); });
  function startRest(sec){ restEnd=now()+sec*1000; restPlayed=false; restEl.classList.add("show"); restTimeEl.classList.remove("done");
    if(restInt) clearInterval(restInt); restInt=setInterval(restStep,250); restStep(); }
  function restStep(){ const left=(restEnd-now())/1000;
    if(left<=0){ restTimeEl.textContent="0:00"; restTimeEl.classList.add("done"); if(!restPlayed){ restPlayed=true; buzz(); } clearInterval(restInt); return; }
    restTimeEl.textContent=fmtMMSS(left); }
  function stopRest(){ if(restInt) clearInterval(restInt); restEl.classList.remove("show"); }
  $("#rest-x").onclick=stopRest;
  function buzz(){ try{ if(navigator.vibrate) navigator.vibrate([200,100,200]); }catch(e){}
    try{ const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return; const a=new AC(); const o=a.createOscillator(), g=a.createGain();
      o.connect(g); g.connect(a.destination); o.type="sine"; o.frequency.value=880;
      g.gain.setValueAtTime(0.0001,a.currentTime); g.gain.exponentialRampToValueAtTime(0.3,a.currentTime+0.02); g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+0.6);
      o.start(); o.stop(a.currentTime+0.6); }catch(e){} }
  function afterLog(){ if(!state.startedAt && !state.finishedAt) state.startedAt=now(); save(); renderClock(); renderSelector(); if(!state.finishedAt) startRest(90); }

  // ---- экспорт ----
  function buildExport(){
    const L=[];
    L.push("#"+W.id+" · "+W.date+" · "+W.title+" · "+W.subtitle);
    L.push("");
    const _st=startTs(), _fin=finishTs();
    if(_st){ let t="Старт "+fmtClock(_st); if(_fin && _fin>_st) t+=" · Финиш "+fmtClock(_fin)+" · "+Math.round((_fin-_st)/60000)+" мин"; L.push(t); L.push(""); }
    const off = ex => (_st && exFirstT(ex)!=null) ? " ["+fmtMMSS((exFirstT(ex)-_st)/1000)+"]" : "";
    allEx().forEach(ex=>{
      if(ex.bodyweight){ L.push(ex.logName+off(ex)+": "+(state.sets[ex.code]?"✓ "+ex.weight:"—")); return; }
      const d=Array.isArray(state.sets[ex.code])?state.sets[ex.code]:[];
      if(ex.dropset){ const drops=ex.drops||[];
        L.push(ex.logName+off(ex)+": "+drops.map((dw,k)=>{ const s=d[k]||{}; const w=(s.w!==undefined&&s.w!=="")?s.w:dw; const r=(s.r!==undefined&&s.r!=="")?s.r:"_"; return w+"×"+r; }).join(" → ")); return; }
      const parts=[];
      for(let i=0;i<ex.sets;i++){ const s=d[i]||{};
        const w=(s.w!==undefined&&s.w!=="")?s.w:"_"; const r=(s.r!==undefined&&s.r!=="")?s.r:"_"; const rpe=(s.rpe!==undefined&&s.rpe!=="")?" RPE"+s.rpe:"";
        parts.push("п"+(i+1)+" "+w+"×"+r+rpe); }
      L.push(ex.code+" "+ex.logName+off(ex)+": "+parts.join("  "));
    });
    L.push("");
    const f=state.footer;
    L.push("Памп: дельты "+(f.pump_delts||"_")+" / грудь "+(f.pump_chest||"_")+" / спина "+(f.pump_back||"_"));
    L.push("Ощущение: "+(f.feeling||""));
    L.push("Сон ночь / энергия: "+(f.sleep||""));
    if(f.notes) L.push("Заметки: "+f.notes);
    return L.join("\n");
  }
  function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),1800); }
  exportBtn.onclick=async ()=>{
    const txt=buildExport();
    try{ await navigator.clipboard.writeText(txt); toast("Скопировано — вставь в чат с Claude"); }
    catch(e){ const sheet=$("#sheet");
      sheet.innerHTML='<h2>Результаты</h2><div class="sub">Выдели и скопируй вручную</div><textarea class="exportbox" readonly>'+txt.replace(/</g,"&lt;")+'</textarea><div class="sheet-actions"><button class="btn primary" id="m-close">Закрыть</button></div>';
      $("#m-close").onclick=closeSheet; $("#overlay").classList.add("open"); const ta=sheet.querySelector("textarea"); ta.focus(); ta.select(); }
  };
  $("#reset").onclick=()=>{ if(confirm("Очистить введённые данные тренировки #"+W.id+"?")){ state={sets:{},footer:{}}; save(); stopRest(); renderClock(); renderSelector(); render(); toast("Сброшено"); } };

  // ---- init ----
  function renderAll(){ renderSelector(); renderHeader(); renderClock(); render(); }
  const stored=localStorage.getItem("workout-current");
  const firstTodo = WORKOUTS.find(w=>statusOf(w.id)!=="done");
  selectWorkout(stored || (firstTodo?firstTodo.id:WORKOUTS[0].id));
  renderAll();
})();
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
  }
</script>
</body>
</html>
